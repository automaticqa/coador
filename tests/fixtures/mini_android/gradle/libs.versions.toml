detekt = "1.23.7"
firebase-bom = "33.3.0"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version = "1.13.1" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
