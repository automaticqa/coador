[versions]
agp = "8.7.0"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
hilt = "2.52"
compose-bom = "2024.09.02"
retrofit = "2.11.0"
okhttp = "4.12.0"
room = "2.6.1"
