name: Usage feedback
description: Share an optional account of setup, first use, refresh, or missing coverage.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        This public feedback is voluntary. A repository name, source code, generated
        profile, local path, prompt, transcript, and evidence snippet are not required.
        Do not include secrets, private project details, internal URLs, or personal data.
  - type: dropdown
    id: stage
    attributes:
      label: Stage reached
      options:
        - Package installation
        - CLI or MCP configuration
        - First repository scan
        - First evidence-backed answer
        - Refresh after repository changes
        - Ongoing use
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface used
      options:
        - CLI
        - Codex over MCP
        - Claude Code over MCP
        - Another MCP client
        - Python API
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked without a blocker
        - Worked with avoidable friction
        - Blocked during setup or refresh
        - Missing or incorrect detector coverage
    validations:
      required: true
  - type: dropdown
    id: elapsed
    attributes:
      label: Approximate time to the first useful answer
      description: Optional; choose the closest range only if you measured or remember it.
      options:
        - Under 5 minutes
        - 5–15 minutes
        - 15–30 minutes
        - More than 30 minutes
        - No useful answer yet
        - Not measured
  - type: textarea
    id: useful
    attributes:
      label: What was useful?
      description: Optional. Describe the question or workflow without naming a private project.
  - type: textarea
    id: friction
    attributes:
      label: Where was the friction?
      description: Optional. Mention the step and expected behavior; use the bug form for a reproduction.
  - type: textarea
    id: missing_question
    attributes:
      label: Which onboarding question remained unanswered?
      description: Optional. Use the detector-gap form when public or synthetic evidence is available.
  - type: textarea
    id: public_context
    attributes:
      label: Public or synthetic context
      description: Optional. Link only an explicitly public pinned revision or describe a synthetic project shape.
  - type: checkboxes
    id: checks
    attributes:
      label: Public submission check
      options:
        - label: This issue contains no secrets, private source, local paths, internal URLs, prompts, transcripts, or personal data.
          required: true
