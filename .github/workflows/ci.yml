name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - name: docs/detectors.md is generated from the registry
        run: uv run python -m coador.registry --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: verify public release archives
        run: >-
          python tests/packaging/verify_release.py
          dist/coador-*.tar.gz
          dist/coador-*-py3-none-any.whl
      - name: the wheel installs and runs on its own
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/coador --version
          /tmp/check/bin/coador scan tests/fixtures/mini_android --kb-dir /tmp/kb
          /tmp/check/bin/coador overview tests/fixtures/mini_android --kb-dir /tmp/kb
          /tmp/check/bin/python tests/test_mcp_stdio.py \
            tests/fixtures/mini_android
