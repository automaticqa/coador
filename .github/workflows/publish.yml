name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build and verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run python -m coador.registry --check
      - run: uv build
      - name: verify archives and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python tests/packaging/verify_release.py
          --expected-tag "$RELEASE_TAG"
          dist/coador-*.tar.gz
          dist/coador-*-py3-none-any.whl
      - name: install and exercise the release wheel
        run: |
          uv venv /tmp/release-check
          uv pip install --python /tmp/release-check/bin/python dist/*.whl
          /tmp/release-check/bin/coador --version
          /tmp/release-check/bin/coador scan \
            tests/fixtures/mini_android --kb-dir /tmp/release-kb
          /tmp/release-check/bin/coador overview \
            tests/fixtures/mini_android --kb-dir /tmp/release-kb
          /tmp/release-check/bin/python tests/test_mcp_stdio.py \
            tests/fixtures/mini_android
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish verified artifacts
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coador
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: verify downloaded archives again
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python tests/packaging/verify_release.py
          --expected-tag "$RELEASE_TAG"
          dist/coador-*.tar.gz
          dist/coador-*-py3-none-any.whl
      - name: publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
